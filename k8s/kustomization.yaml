# kubectl apply -k k8s/
# Set your domain (and, if needed, ingress class / ClusterIssuer) in the patches below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vr-desktop
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: ghcr.io/michalmedvecky/vr-desktop-server
    newTag: latest
patches:
  - target: { kind: Ingress, name: vr-desktop-server }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: vr.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: vr.example.com
