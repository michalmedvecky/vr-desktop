apiVersion: apps/v1
kind: Deployment
metadata:
  name: vr-desktop-server
  labels: { app.kubernetes.io/name: vr-desktop-server }
spec:
  # Rooms live in memory: keep exactly one replica (the Mac and the Quest must meet on the same pod).
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: vr-desktop-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vr-desktop-server }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: ghcr.io/michalmedvecky/vr-desktop-server:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
