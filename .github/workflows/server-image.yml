name: Build server image

on:
  push:
    branches: ['**']
    paths: ['server/**', 'mac/Web/**', 'k8s/**', '.github/workflows/server-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test relay server (signaling + web client through the relay)
        run: |
          cd server && npm ci && node test.js

      - name: Validate Kubernetes manifests
        run: kubectl kustomize k8s/ > /dev/null && kubectl kustomize k8s/ | head -n 200

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ghcr.io/michalmedvecky/vr-desktop-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/michalmedvecky/vr-desktop-server:latest
            ghcr.io/michalmedvecky/vr-desktop-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=VR Desktop relay server
